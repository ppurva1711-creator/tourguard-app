name: tourguard_flutter
publish_to: 'none'
description: TourGuard offline-first Flutter companion app
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  http: ^1.2.2
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/data/hotels.json
    - assets/data/spots.json
